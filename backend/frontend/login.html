<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in | Voxa</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main class="authWrap">
    <div class="authCard">
      <div class="authBrand">
        <img src="./assets/voxa-logo.jpg" class="logo" alt="Voxa" />
        <div>
          <div class="brandName">Voxa</div>
          <div class="brandMotto">Turn speech into clear text.</div>
        </div>
      </div>

      <h1 class="authTitle">Log in</h1>

      <form id="loginForm" class="form">
        <label class="label">Email</label>
        <input id="email" class="input" type="email" required />

        <label class="label">Password</label>
        <input id="password" class="input" type="password" required />

        <button class="btn primary" type="submit">Log in</button>
        <p style="margin-top:12px;">
  <a href="./forgot.html" style="text-decoration: none; color: green;">Forgot password?</a>
</p>
        <div class="status" id="status">Waiting.</div>

        <div class="orRow">
  <span></span>
  <div class="orText">or</div>
  <span></span>
</div>

<button id="googleLoginBtn" type="button" class="btn googleBtn">
    <span class="gIcon">G</span>
    <span>Continue with Google</span>
</button>

<div id="googleErr" style="display:none;"></div>

      </form>

      <div class="authFooter">
        No account yet? <a href="./signup.html" style="text-decoration: none; color: green;">Sign up</a>
      </div>
    </div>
  </main>

  <script src="./common.js"></script>
  <script src="./login.js"></script>
  <script src="./support-bubbles.js"></script>
  <footer class="app-footer">
  <div class="footer-links">
    <a href="/privacy.html">Privacy Policy</a>
    <a href="/terms.html">Terms</a>
    <a href="/refund.html">Refund Policy</a>
  </div>
  <p class="footer-copy">
    © 2026 Voxa. All rights reserved.
  </p>
</footer>
</body>
</html>
